<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="line-grad" x1="8" y1="34" x2="40" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="48" height="48" rx="12" fill="url(#bg-grad)"/>
  <!-- Upward trend line (chart) -->
  <polyline points="10,34 18,26 24,30 32,18 38,12" stroke="url(#line-grad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Arrow head at the end of trend -->
  <polyline points="33,12 38,12 38,17" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Dollar sign -->
  <text x="14" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="white" opacity="0.5">₹</text>
</svg>
